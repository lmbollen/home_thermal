[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "home-thermal-core"
version = "0.1.0"
description = "Grey-box thermal model (RC network) of a house, built from a YAML config"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/home_thermal"]
