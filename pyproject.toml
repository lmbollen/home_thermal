# Development settings for the whole repository. Each package has its own pyproject.toml.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["home_thermal"]
